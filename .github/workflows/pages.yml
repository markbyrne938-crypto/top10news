name: Top10News site

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**']

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the run start the next run (see "rearm" below)

# Only one run at a time. A newer run cancels an older one, so a run that hangs
# (as run #808 did for a month) can never block the schedule again.
concurrency:
  group: top10news-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        if: github.event_name == 'push'
        run: npm test
      - name: Fetch previous data (keeps ranks and change history)
        run: curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/top10.json" -o "$RUNNER_TEMP/prev.json" || true
      - name: Build
        id: build
        env:
          PREV_JSON: ${{ runner.temp }}/prev.json
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/build-static.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Alert if sources are down
        if: steps.build.outputs.down >= 3
        run: |
          echo "::error::${{ steps.build.outputs.down }} sources failed: ${{ steps.build.outputs.names }}"
          exit 1

  # GitHub's cron trigger is best-effort and can go quiet for hours, so each run
  # starts the next one 5 minutes after it began. This job runs alongside the build
  # (not after it), so the next run is started even if the build hangs or fails.
  # The cron line above is a backup that restarts the chain if it ever breaks.
  rearm:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait, then start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 288
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
